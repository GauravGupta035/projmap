<style>

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const C = D.content;
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const md = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');
const day = iso => iso ? new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) : '';
const list = k => C[k] || [];
const T = (k, fallback) => (C.text && C.text[k]) || fallback;
const plural = (n, word) => n + ' ' + word + (n === 1 ? '' : 's');
const byN = Object.fromEntries(D.issues.map(i => [i.n, i]));
const comp = Object.fromEntries(list('components').map(c => [c.id, c]));
const rule = Object.fromEntries(list('rules').map(r => [r.id, r]));
const groupBy = (rows, key) => rows.reduce((m, x) => ((m[x[key] || ''] = m[x[key] || ''] || []).push(x), m), {});
const extras = view => list('lists').filter(l => (l.view || 'words') === view);

/* ---------- issues: stage comes from the build, the words from content ---------- */
const STAGE = Object.fromEntries(D.stages.map(s => [s.id, s]));
const tone = k => (STAGE[k] || {}).tone || 'idle';
const notes = C.notes || {};
D.issues.forEach(i => { const w = (C.issues || {})[i.n] || {}; i.plain = w.plain || ''; i.part = w.part || ''; i.short = w.label || i.title; });
const inStage = flag => D.issues.filter(i => (STAGE[i.stage] || {})[flag]);
const pill = k => `<span class="pill ${tone(k) === 'idle' ? '' : tone(k)}">${esc((STAGE[k] || {}).name || k)}</span>`;
const chip = n => byN[n] ? `<a class="chip ${tone(byN[n].stage) === 'ok' ? 'done' : tone(byN[n].stage) === 'stop' ? 'needs' : ''}" href="${byN[n].url}" target="_blank" rel="noopener" title="${esc(byN[n].plain || byN[n].title)}">#${n}</a>` : `<span class="chip">#${n}</span>`;
const withChips = s => esc(s).replace(/#(\d+)/g, (_, d) => chip(+d));
const prsFor = n => D.prs.filter(p => p.closes.includes(n));
const partName = p => comp[p] ? comp[p].name : p ? p[0].toUpperCase() + p.slice(1) : '';
const ST = { built: ['Built', 'c-ok', 'ok'], partial: ['Partly built', 'c-warn', 'warn'], stub: ['Empty placeholder', 'c-idle', ''], planned: ['Not in the repo yet', 'c-idle', ''] };
const st = c => ST[c.status] || ST.built;
const moduleName = m => { const c = list('components').filter(x => x.module === m); return c.length === 1 ? c[0].name : m; };

/* ---------- drawing helpers ---------- */
function wrap(text, max, lines) {
  const out = []; let cur = '';
  for (const w of String(text).split(/\s+/)) {
    if ((cur + ' ' + w).trim().length > max && cur) { out.push(cur); cur = w; } else cur = (cur + ' ' + w).trim();
  }
  if (cur) out.push(cur);
  if (out.length > lines) { out.length = lines; out[lines - 1] = out[lines - 1].slice(0, max - 1).replace(/[\s,.]+$/, '') + '…'; }
  return out;
}
/* A curved arrow from a to b. It leaves and arrives along the given axis ('v' or 'h'). */
function curve(a, b, axis, cls) {
  const dx = b[0] - a[0], dy = b[1] - a[1];
  const c1 = axis === 'v' ? [a[0], a[1] + dy / 2] : [a[0] + dx / 2, a[1]], c2 = axis === 'v' ? [b[0], b[1] - dy / 2] : [b[0] - dx / 2, b[1]];
  const ang = axis === 'v' ? (dy >= 0 ? 90 : -90) : (dx >= 0 ? 0 : 180);
  return `<path class="e ${cls}" d="M${a[0]} ${a[1]} C${c1[0]} ${c1[1]} ${c2[0]} ${c2[1]} ${b[0]} ${b[1]}"/><path class="ah ${cls}" d="M0 0 L-8 -4 L-8 4 Z" transform="translate(${b[0]} ${b[1]}) rotate(${ang})"/>`;
}
/* Puts nodes in rows: a node sits one row below its deepest parent, and under the middle of its parents. */
function layered(ids, edges, widest) {
  const inn = {}; ids.forEach(i => { inn[i] = []; });
  edges.forEach(([a, b]) => { if (a in inn && b in inn && a !== b) inn[b].push(a); });
  const depth = {}, busy = {};
  const find = i => { if (i in depth) return depth[i]; if (busy[i]) return -1; busy[i] = true;
    let d = 0; for (const p of inn[i]) d = Math.max(d, find(p) + 1); return depth[i] = d; };
  ids.forEach(find);
  let rows = []; ids.forEach(i => (rows[depth[i]] = rows[depth[i]] || []).push(i));
  const x = {};
  rows = rows.filter(Boolean).flatMap(row => {
    const mid = i => { const ps = inn[i].filter(p => p in x); return ps.length ? ps.reduce((s, p) => s + x[p], 0) / ps.length : 0.5; };
    row = row.map((i, k) => [mid(i), k, i]).sort((p, q) => p[0] - q[0] || p[1] - q[1]).map(p => p[2]);
    const parts = []; for (let k = 0; k < row.length; k += widest) parts.push(row.slice(k, k + widest));
    parts.forEach(part => part.forEach((i, k) => { x[i] = (k + 0.5) / part.length; }));
    return parts;
  });
  return rows;
}
function wireNodes(svg, onPick) {
  if (!svg) return;
  svg.querySelectorAll('.n').forEach(g => {
    const go = () => { svg.querySelectorAll('.n.sel').forEach(x => x.classList.remove('sel')); g.classList.add('sel'); onPick(g.dataset.id); };
    g.addEventListener('click', go);
    g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
  });
}

/* ---------- the parts diagram: positions from content when given, worked out otherwise ---------- */
const SYS = (() => {
  const cs = list('components'), BH = 68, GAP = 40, PITCH = 96;
  const flow = (C.flow || list('links').map(l => [l.from, l.to])).filter(([a, b]) => comp[a] && comp[b]);
  const pos = {};
  if (cs.length && cs.every(c => Array.isArray(c.pos))) cs.forEach(c => { pos[c.id] = c.pos; });
  else {
    const rows = layered(cs.map(c => c.id), flow, 4), most = Math.max(1, ...rows.map(r => r.length));
    rows.forEach((row, r) => row.forEach((id, k) => { pos[id] = [k + (most - row.length) / 2, r]; }));
  }
  const cols = Math.ceil(Math.max(0, ...cs.map(c => pos[c.id][0]))) + 1, lastRow = Math.max(0, ...cs.map(c => pos[c.id][1]));
  const W = Math.max(770, cols * 250), bw = (W - 28 - (cols - 1) * GAP) / cols;
  const box = {}; cs.forEach(c => { box[c.id] = { x: 14 + pos[c.id][0] * (bw + GAP), y: 14 + pos[c.id][1] * PITCH }; });
  /* Each arrow picks the two facing sides; arrows sharing a side are spread along it. */
  const ends = flow.map(([a, b]) => {
    const A = box[a], B = box[b];
    if (Math.abs(A.x - B.x) < bw / 2) return B.y > A.y ? [a, 'bottom', b, 'top', 'v'] : [a, 'top', b, 'bottom', 'v'];
    return B.x > A.x ? [a, 'right', b, 'left', 'h'] : [a, 'left', b, 'right', 'h'];
  });
  const sides = {};
  ends.forEach(([a, sa, b, sb], k) => {
    (sides[a + sa] = sides[a + sa] || []).push({ k, end: 0, far: sa === 'top' || sa === 'bottom' ? box[b].x : box[b].y });
    (sides[b + sb] = sides[b + sb] || []).push({ k, end: 1, far: sb === 'top' || sb === 'bottom' ? box[a].x : box[a].y });
  });
  const pts = ends.map(() => [null, null]);
  for (const key in sides) {
    const group = sides[key].sort((p, q) => p.far - q.far);
    group.forEach((p, order) => {
      const [a, sa, b, sb] = ends[p.k], id = p.end ? b : a, side = p.end ? sb : sa, B = box[id], t = (order + 1) / (group.length + 1);
      pts[p.k][p.end] = side === 'top' ? [B.x + bw * t, B.y] : side === 'bottom' ? [B.x + bw * t, B.y + BH] : side === 'left' ? [B.x, B.y + BH * t] : [B.x + bw, B.y + BH * t];
    });
  }
  const arrows = ends.map((e, k) => curve(pts[k][0], pts[k][1], e[4], '')).join('');
  return { box, bw, BH, W, H: 14 + lastRow * PITCH + BH + 14, arrows };
})();
function sysSvg(id, lit, sel, faint) {
  let svg = SYS.arrows;
  for (const c of list('components')) {
    const { x, y } = SYS.box[c.id], w = SYS.bw;
    const cls = [st(c)[1], lit ? (lit.has(c.id) ? 'lit' : faint && faint.has(c.id) ? 'lit2' : 'dim') : '', sel === c.id ? 'sel' : ''].join(' ');
    svg += `<g class="n ${cls}" data-id="${esc(c.id)}" tabindex="0" role="button" aria-label="${esc(c.name)}, ${st(c)[0]}"><rect x="${x}" y="${y}" width="${w}" height="${SYS.BH}" rx="8"/>
      <circle class="dot" cx="${x + w - 14}" cy="${y + 17}" r="4"/><text class="ttl" x="${x + 12}" y="${y + 22}">${esc(wrap(c.name, Math.floor((w - 40) / 7), 1)[0])}</text>
      ${wrap(c.short || '', Math.floor((w - 24) / 5.7), 2).map((l, k) => `<text class="sub" x="${x + 12}" y="${y + 40 + k * 14}">${esc(l)}</text>`).join('')}</g>`;
  }
  return `<div class="scroll"><svg id="${id}" viewBox="0 0 ${SYS.W} ${SYS.H}" role="img" aria-label="The parts of the project and how they connect">${svg}</svg></div>`;
}
const sysLegend = list('components').some(c => c.status && c.status !== 'built') ? `<div class="row small"><span class="pill ok">Built</span><span class="pill warn">Partly built</span><span class="pill">Empty or not in the repo yet</span></div>` : '';
function strip(spec) {

/* ---------- Work ---------- */
const backlog = D.backlog.filter(n => byN[n]);

function dagSvg() {
  const NW = 176, NH = 64, PITCH = 92, W = 770;
  const edges = backlog.flatMap(n => byN[n].deps.filter(d => backlog.includes(d)).map(d => [d, n]));
  const rows = layered(backlog, edges, 4), at = {};
  rows.forEach((row, r) => row.forEach((n, k) => { at[n] = { cx: W * (k + 0.5) / row.length, top: 16 + r * PITCH }; }));
  let svg = edges.map(([a, b]) => at[b].top > at[a].top
    ? curve([at[a].cx, at[a].top + NH], [at[b].cx, at[b].top], 'v', byN[a].open ? 'unmet' : 'met')
    : curve([at[a].cx + NW / 2, at[a].top + NH / 2], [at[b].cx - NW / 2, at[b].top + NH / 2], 'h', byN[a].open ? 'unmet' : 'met')).join('');
  for (const n of backlog) {
    const i = byN[n], p = at[n], x = p.cx - NW / 2, name = (STAGE[i.stage] || {}).name || i.stage;
    svg += `<g class="n c-${tone(i.stage)}" data-id="${n}" tabindex="0" role="button" aria-label="Issue ${n}, ${esc(name)}"><rect x="${x}" y="${p.top}" width="${NW}" height="${NH}" rx="8"/>
      <text class="num" x="${x + 12}" y="${p.top + 21}">#${n}</text><text class="st" x="${x + NW - 12}" y="${p.top + 20}">${esc(wrap(name, 20, 1)[0])}</text>
      ${wrap(i.short, 27, 2).map((l, k) => `<text class="t" x="${x + 12}" y="${p.top + 38 + k * 14}">${esc(l)}</text>`).join('')}</g>`;
  }
  return `<div class="scroll"><svg id="dag" viewBox="0 0 ${W} ${16 + (rows.length - 1) * PITCH + NH + 16}" role="img" aria-label="Which issue waits for which">${svg}</svg></div>`;
}

      <div class="panel stack"><span class="label">Pull requests merged</span><span class="big">${D.prs.filter(p => p.mergedAt).length}</span><span class="small muted">${D.prs.filter(p => p.state === 'OPEN').length} open, ${D.prs.filter(p => p.state === 'CLOSED').length} closed without merging</span></div>
    </div>
  </div>
  <div class="sec">
    <h2>How an issue travels</h2>
    <div class="pipe">${D.pipeline.map(s => { const at = stepCount(s); return `<div class="step ${s.side ? 'side' : ''}"><div class="row"><h3>${esc(s.name)}</h3><span class="pill ${at.length && !s.countOnly ? (s.side ? 'stop' : 'acc') : ''}">${at.length}</span></div>${s.label ? `<code class="small" style="align-self:flex-start">${esc(s.label)}</code>` : ''}<span class="who">${esc(s.who || '')}</span>
      <div class="row">${s.countOnly ? '' : at.slice(0, 14).map(i => chip(i.n)).join('')}</div></div>`; }).join('')}</div>
  </div>
  ${backlog.length ? `<div class="sec">
    <h2>The backlog, in build order</h2>
    <p class="lede small">An arrow means the lower issue waits for the upper one. Green arrows are satisfied. Select an issue to see what it touches.</p>
    <div class="row small">${D.stages.filter(s => backlog.some(n => byN[n].stage === s.id)).map(s => pill(s.id)).join('')}</div>
    ${dagSvg()}
    <div class="panel stack" id="idetail" data-first="${firstPick || ''}">${firstPick ? issueDetail(firstPick) : '<span class="muted small">Select an issue in the tree.</span>'}</div>
  </div>` : ''}
  ${touchTable()}
  <div class="sec">
    <h2>Every issue in one line</h2>
    <input type="search" id="q" placeholder="Filter" aria-label="Filter issues">
    <div class="scroll"><table><thead><tr><th>Issue</th><th>In plain words</th><th>Part</th><th>State</th></tr></thead><tbody>
    ${D.issues.slice().reverse().map(i => `<tr data-f><td class="id">${chip(i.n)}</td><td>${esc(i.plain || i.title)}${i.plain ? '' : ' <span class="tag">title only</span>'}</td><td class="nw small muted">${esc(partName(i.part))}</td><td class="nw">${pill(i.stage)}</td></tr>`).join('')}</tbody></table></div>
  </div>
  <div class="sec">
    <details class="panel"><summary>All ${plural(D.prs.length, 'pull request')}</summary>
    <table><thead><tr><th>PR</th><th>Title</th><th>Closes</th><th>Touches</th><th>State</th></tr></thead><tbody>
    ${D.prs.map(p => `<tr><td class="id"><a class="chip" href="${p.url}" target="_blank" rel="noopener">${p.n}</a></td><td>${md(p.title)}</td><td class="nw">${p.closes.map(chip).join(' ')}</td><td class="small muted">${esc(p.touches.join(', '))}</td>
      <td class="nw"><span class="pill ${p.mergedAt ? 'ok' : p.state === 'OPEN' ? 'acc' : ''}">${p.mergedAt ? 'Merged ' + day(p.mergedAt) : p.state === 'OPEN' ? 'Open' : 'Closed, no merge'}</span></td></tr>`).join('')}</tbody></table></details>
  </div>`;
}

/* ---------- routing ---------- */
const VIEWS = {};
if (list('story').length || list('walk').length) VIEWS.start = ['Start here', viewStart];
if (list('terms').length || extras('words').length) VIEWS.words = ['Words', viewWords];
if (list('components').length) VIEWS.fit = ['How it fits', viewFit];
if (list('knobs').length) VIEWS.knobs = ['What changes what', viewKnobs];
if (list('rules').length || list('decisions').length) VIEWS.rules = ['Rules and decisions', viewRules];
VIEWS.work = ['Work', viewWork];
const HOME = Object.keys(VIEWS)[0];

document.title = D.title;
$('#title').textContent = D.title;
$('#built').innerHTML = `${D.live ? 'Live. Facts' : 'Built'} from GitHub at ${esc(D.generated)}`;
if (D.note) { $('#note').hidden = false; $('#note').textContent = D.note; }
$('#foot').innerHTML = D.drift.length
  ? `<b style="color:var(--stop)">This map is behind the repo.</b> ${D.drift.map(d => `${esc(d.kind)} <code>${esc(d.id)}</code> ${esc(d.problem)}`).join('; ')}. Add the missing records to <code>${esc(D.contentPath)}</code>.`
  : `Everything the map tracks in the repo has a record here. Rebuild with <code>${esc(D.rebuild)}</code>.`;
$('#tabs').innerHTML = Object.entries(VIEWS).map(([k, v]) => `<button role="tab" id="tab-${k}" data-k="${k}">${v[0]}</button>`).join('');
$('#tabs').addEventListener('click', e => { const k = e.target.dataset && e.target.dataset.k; if (k) location.hash = k; });
function show(focusId) {
  const k = VIEWS[location.hash.slice(1)] ? location.hash.slice(1) : HOME;
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.k === k));
  const view = $('#view');
  view.innerHTML = VIEWS[k][1]();
  const on = (sel, fn) => { const el = $(sel); if (el && el.addEventListener) el.addEventListener('click', fn); };
  if (k === 'start') {
    on('#prev', () => { walkStep = Math.max(0, walkStep - 1); show('prev'); });
    on('#next', () => { walkStep = Math.min(list('walk').length - 1, walkStep + 1); show('next'); });
    wireNodes($('#walk'), id => { compSel = id; location.hash = 'fit'; });
  }
  if (k === 'fit') wireNodes($('#sys'), id => { compSel = id; $('#sdetail').innerHTML = compDetail(id); });
  if (k === 'knobs') {
    view.querySelectorAll('[data-knob]').forEach(b => b.addEventListener('click', () => { knobSel = b.dataset.knob; show(); }));
    wireNodes($('#ksys'), id => { compSel = id; location.hash = 'fit'; });
  }
  if (k === 'work') {
    const dag = $('#dag'), detail = $('#idetail');
    wireNodes(dag, id => { detail.innerHTML = issueDetail(+id); });
    const node = dag && detail && detail.dataset.first && dag.querySelector(`[data-id="${detail.dataset.first}"]`); if (node) node.classList.add('sel');
  }
  const q = $('#q');
  if (q && q.addEventListener) q.addEventListener('input', e => {
    const text = e.target.value.trim().toLowerCase();
    view.querySelectorAll('[data-f]').forEach(el => { el.hidden = !!text && !el.textContent.toLowerCase().includes(text); });
  });
  const focus = focusId && document.getElementById(focusId);
  if (focus && focus.focus) { if (focus.disabled) (document.getElementById(focusId === 'next' ? 'prev' : 'next') || focus).focus(); else focus.focus(); }
}
window.addEventListener('hashchange', () => show());
show();

/* Served by `projmap serve`: reload when the build behind the page changes. */
if (D.live) setInterval(async () => {
  try { const v = await (await fetch('version', { cache: 'no-store' })).text(); if (v && v !== D.version + (D.note || '')) location.reload(); } catch (e) { /* server stopped; keep the page */ }
}, 4000);
</script>
